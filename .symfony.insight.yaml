# Pelso OpenAPI Validator Bundle
# Symfony 3.4 / PHP 7.2

php_version: 7.2

global_exclude_dirs:
    # Third-party dependencies
    - vendor
    - vendors

    # Test environments and fixtures
    - Tests
    - tests
    - test
    - spec
    - features
    - Fixtures
    - DataFixtures

    # Generated files
    - var
    - cache
    - logs
    - coverage

exclude_patterns:
    # Nested dependencies
    - 'Tests/**/vendor/**'
    - 'Tests/**/vendors/**'

    # Generated Symfony test containers and cache
    - 'Tests/**/cache/**'
    - 'Tests/**/var/**'
    - 'Tests/**/logs/**'

commit_failure_conditions:
    - "project.severity.critical > 0"
    - "project.severity.major > 0"
