php_version: 8.1

ignore_branches:
    - gh-pages

global_exclude_dirs:
    - vendor
    - vendors
    - test
    - tests
    - Tests
    - spec
    - features
    - Fixtures
    - DataFixtures
    - var
    - cache
    - logs
    - coverage
    - node_modules

exclude_patterns:
    - 'var/*'
    - 'var/**/*'
    - 'var/phpstan/cache/nette.configurator/*.php'

pre_composer_script: |
    #!/bin/bash
    echo "=== BEFORE COMPOSER ==="
    pwd
    php -v
    ls -la
    find . -type d -name phpstan -print

post_composer_script: |
    #!/bin/bash
    echo "=== AFTER COMPOSER ==="
    pwd
    ls -la
    find . -type d -name phpstan -print
    echo "=== PHPSTAN CACHE ==="
    if [ -d var/phpstan ]; then
        find var/phpstan -type f
    fi
    echo "=== END DIAGNOSTICS ==="

commit_failure_conditions:
    - "project.severity.critical > 0"
    - "project.severity.major > 0"
