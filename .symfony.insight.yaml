# Pelso OpenAPI Validator Bundle
# Symfony 3.4 / PHP 7.2

php_version: 8.1

global_exclude_dirs:
    - vendor
    - vendors
    - node_modules
    - Tests
    - tests
    - test
    - spec
    - features
    - Fixtures
    - DataFixtures
    - var
    - cache
    - logs
    - coverage
    - build

exclude_patterns:
    - 'var/**'
    - 'var/phpstan/**'
    - 'var/phpstan/cache/**'
    - 'var/phpstan/cache/nette.configurator/*.php'
    - 'vendor/**'
    - 'vendors/**'
    - '**/vendor/**'
    - '**/vendors/**'
    - '**/cache/**'
    - '**/logs/**'
    - '**/var/**'
    - 'Tests/**'
    - 'coverage/**'
    - '**/coverage/**'
    - 'build/**'

commit_failure_conditions:
    - "project.severity.critical > 0"
    - "project.severity.major > 0"
