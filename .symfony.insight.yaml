php_version: 7.2


global_exclude_dirs:
    - vendor
    - vendors
    - test
    - tests
    - Tests
    - spec
    - features
    - Fixtures
    - DataFixtures
    - var
    - test_artifacts
    - node_modules

commit_failure_conditions:
    - "project.severity.critical > 0"
    - "project.severity.major > 0"
