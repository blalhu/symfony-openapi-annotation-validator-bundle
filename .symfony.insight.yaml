
php_version: 7.2

global_exclude_dirs:
    - vendor
    - vendors
    - Tests
    - tests
    - test
    - spec
    - features
    - Fixtures
    - DataFixtures
    - var
    - cache
    - logs
    - coverage

exclude_patterns:
    # Root-level analysis artifacts
    - 'var/**'
    - 'var/phpstan/**'
    - 'var/phpstan/cache/**'
    - 'var/phpstan/cache/nette.configurator/*.php'

    # Third-party dependencies
    - 'vendor/**'
    - 'vendors/**'
    - 'Tests/**/vendor/**'
    - 'Tests/**/vendors/**'

    # Integration test application
    - 'Tests/Integration/cache/**'
    - 'Tests/Integration/logs/**'
    - 'Tests/Integration/coverage/**'
    - 'Tests/Unit/coverage/**'

commit_failure_conditions:
    - "project.severity.critical > 0"
    - "project.severity.major > 0"
